  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;compound-sim-jp&quot; data-mode=&quot;forward&quot;&gt;
  &lt;style&gt;
    #compound-sim-jp {
      color-scheme: light dark;
      --sim-bg: Canvas;
      --sim-surface: Field;
      --sim-text: CanvasText;
      --sim-muted: GrayText;
      --sim-border: color-mix(in srgb, CanvasText 15%, transparent);
      --sim-soft: color-mix(in srgb, AccentColor 9%, Canvas);
      --sim-series-1: LinkText;
      --sim-series-2: AccentColor;
      color: var(--sim-text);
      font-family: ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif;
      padding: clamp(16px, 3vw, 32px);
      max-width: 1180px;
      margin-inline: auto;
    }
    #compound-sim-jp * { box-sizing: border-box; }
    #compound-sim-jp .sim-header { margin-bottom: 22px; }
    #compound-sim-jp .sim-title { margin: 0 0 5px; letter-spacing: -.02em; }
    #compound-sim-jp .sim-subtitle { margin: 0; color: var(--sim-muted); }
    #compound-sim-jp .controls-wrap {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) minmax(160px, .8fr);
      gap: 16px;
      align-items: end;
      padding: 20px;
      margin-bottom: 18px;
      background: var(--sim-soft);
      border: 1px solid var(--sim-border);
      border-radius: 16px;
    }
    #compound-sim-jp .form-label { display: grid; gap: 7px; font-weight: 500; }
    #compound-sim-jp .form-control {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      color: var(--sim-text);
      background: var(--sim-surface);
      border: 1px solid var(--sim-border);
      border-radius: 9px;
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    #compound-sim-jp .form-control:focus { outline: 2px solid AccentColor; outline-offset: 2px; }
    #compound-sim-jp .switch-line { min-height: 44px; display: flex; align-items: center; }
    #compound-sim-jp .form-check { display: flex; align-items: center; gap: 10px; }
    #compound-sim-jp .form-check-input { width: 42px; height: 23px; accent-color: AccentColor; cursor: pointer; }
    #compound-sim-jp .form-check-label { font-weight: 500; cursor: pointer; }
    #compound-sim-jp .tabs { display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 16px; border: 1px solid var(--sim-border); border-radius: 12px; background: var(--sim-soft); }
    #compound-sim-jp .tab-button { min-height: 36px; padding: 6px 14px; border: 0; border-radius: 8px; color: var(--sim-muted); background: transparent; font: inherit; font-weight: 500; cursor: pointer; }
    #compound-sim-jp .tab-button[aria-selected=&quot;true&quot;] { color: var(--sim-text); background: var(--sim-surface); box-shadow: 0 1px 8px color-mix(in srgb, CanvasText 8%, transparent); }
    #compound-sim-jp .tab-panel[hidden] { display: none; }
    #compound-sim-jp[data-mode=&quot;goal&quot;] .forward-only { display: none; }
    #compound-sim-jp .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 0 0 26px; }
    #compound-sim-jp .goal-controls { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    #compound-sim-jp .goal-summary { display: grid; grid-template-columns: minmax(220px, 1.2fr) repeat(3, minmax(160px, 1fr)); gap: 14px; margin: 0 0 26px; }
    #compound-sim-jp .goal-primary .viz-stat-value { font-size: clamp(26px, 4vw, 38px); }
    #compound-sim-jp .limit-note { grid-column: 1 / -1; margin: 0; color: var(--sim-muted); }
    #compound-sim-jp .card {
      padding: 18px;
      background: var(--sim-surface);
      border: 1px solid var(--sim-border);
      border-radius: 14px;
      box-shadow: 0 8px 24px color-mix(in srgb, CanvasText 6%, transparent);
    }
    #compound-sim-jp .viz-stat-value { margin: 6px 0 3px; font-size: clamp(21px, 3vw, 30px); font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #compound-sim-jp .text-muted { color: var(--sim-muted); }
    #compound-sim-jp .text-small { font-size: 12px; }
    #compound-sim-jp .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 6px; }
    #compound-sim-jp .chart-head h2 { margin: 0; }
    #compound-sim-jp .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    #compound-sim-jp .legend span { display: inline-flex; align-items: center; gap: 5px; }
    #compound-sim-jp .swatch { width: 18px; height: 3px; display: inline-block; }
    #compound-sim-jp .swatch.total { background: var(--sim-series-1); }
    #compound-sim-jp .swatch.paid { background: var(--sim-series-2); }
    #compound-sim-jp .chart-shell { width: 100%; min-height: 280px; }
    #compound-sim-jp .chart-svg { width: 100%; display: block; }
    #compound-sim-jp .chart-frame { fill: none; stroke: var(--sim-border); }
    #compound-sim-jp .grid-line { stroke: var(--sim-border); stroke-width: 1; }
    #compound-sim-jp .axis-text, #compound-sim-jp .axis-title { fill: var(--sim-text); font-size: 12px; }
    #compound-sim-jp .axis-muted { fill: var(--sim-muted); font-size: 12px; }
    #compound-sim-jp .area-total { fill: var(--sim-series-1); opacity: .12; }
    #compound-sim-jp .line-total { fill: none; stroke: var(--sim-series-1); stroke-width: 3; }
    #compound-sim-jp .line-paid { fill: none; stroke: var(--sim-series-2); stroke-width: 2; stroke-dasharray: 6 4; }
    #compound-sim-jp .hover-line { stroke: var(--sim-text); stroke-width: 1; pointer-events: none; }
    #compound-sim-jp .hover-dot-total { fill: var(--sim-series-1); }
    #compound-sim-jp .hover-dot-paid { fill: var(--sim-series-2); }
    #compound-sim-jp .tooltip { position: absolute; pointer-events: none; background: var(--sim-surface); color: var(--sim-text); border: 1px solid var(--sim-border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px color-mix(in srgb, CanvasText 14%, transparent); z-index: 3; }
    #compound-sim-jp .plot-relative { position: relative; }
    #compound-sim-jp .table-block { margin-top: 28px; }
    #compound-sim-jp .table-block h2 { margin-bottom: 8px; }
    #compound-sim-jp .table-responsive { overflow: visible; border: 1px solid var(--sim-border); border-radius: 14px; }
    #compound-sim-jp .table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #compound-sim-jp .table th, #compound-sim-jp .table td { padding: 11px 14px; border-bottom: 1px solid var(--sim-border); }
    #compound-sim-jp .table th { position: sticky; top: 0; z-index: 2; text-align: left; background: color-mix(in srgb, AccentColor 12%, Canvas); font-weight: 500; box-shadow: 0 1px 0 var(--sim-border), 0 5px 12px color-mix(in srgb, CanvasText 8%, transparent); }
    #compound-sim-jp .table tbody tr:last-child td { border-bottom: 0; }
    #compound-sim-jp .table tbody tr:hover { background: var(--sim-soft); }
    #compound-sim-jp .text-end { text-align: right !important; }
    #compound-sim-jp .text-nowrap { white-space: nowrap; }
    #compound-sim-jp .gain-positive { color: LinkText; }
    #compound-sim-jp .gain-negative { color: MarkText; background: Mark; }
    @media (max-width: 820px) {
      #compound-sim-jp .controls-wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #compound-sim-jp .metrics, #compound-sim-jp .goal-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      #compound-sim-jp { padding: 14px; }
      #compound-sim-jp .tabs { display: grid; grid-template-columns: 1fr; width: 100%; }
      #compound-sim-jp .controls-wrap, #compound-sim-jp .metrics, #compound-sim-jp .goal-summary { grid-template-columns: 1fr; }
      #compound-sim-jp .chart-shell { min-height: 245px; }
      #compound-sim-jp .table th, #compound-sim-jp .table td { padding: 9px 10px; }
      #compound-sim-jp .table-responsive { overflow-x: auto; }
    }

        &lt;div class=&quot;text-small text-muted&quot; id=&quot;cs-goal-months&quot;&gt;—&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;div class=&quot;text-muted&quot;&gt;目標時点の資産&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-goal-final&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;逆算した積立額で計算&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;div class=&quot;text-muted&quot;&gt;累計投資額&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-goal-contrib&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;取得額＋必要積立額&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;section aria-labelledby=&quot;cs-combined-chart-title&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;
        &lt;h2 id=&quot;cs-combined-chart-title&quot;&gt;合計資産の推移&lt;/h2&gt;
        &lt;div class=&quot;legend text-small&quot; aria-label=&quot;凡例&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;swatch total&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;合計資産&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;swatch paid&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;累計投資・拠出額&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plot-relative&quot;&gt;
        &lt;div id=&quot;cs-combined-chart&quot; class=&quot;chart-shell&quot;&gt;&lt;/div&gt;
        &lt;div id=&quot;cs-combined-tip&quot; class=&quot;tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;table-block&quot; aria-labelledby=&quot;cs-combined-table-title&quot;&gt;
      &lt;h2 id=&quot;cs-combined-table-title&quot;&gt;年ごとの明細&lt;/h2&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;年&lt;/th&gt;&lt;th&gt;年齢&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;合計資産&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;通常資産&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;DC資産&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;累計投資・拠出額&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody id=&quot;cs-combined-body&quot;&gt;&lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tab-panel&quot; id=&quot;cs-combined-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;cs-tab-combined&quot; hidden&gt;
    &lt;div class=&quot;viz-controls controls-wrap&quot; aria-label=&quot;DC条件&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;cs-dc-current&quot;&gt;DC現在額（円）
        &lt;input class=&quot;form-control&quot; id=&quot;cs-dc-current&quot; type=&quot;text&quot; value=&quot;800,000&quot; inputmode=&quot;numeric&quot; pattern=&quot;[0-9,]*&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;cs-dc-monthly&quot;&gt;DC月々の拠出（円）
        &lt;input class=&quot;form-control&quot; id=&quot;cs-dc-monthly&quot; type=&quot;text&quot; value=&quot;20,000&quot; inputmode=&quot;numeric&quot; pattern=&quot;[0-9,]*&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;cs-dc-rate&quot;&gt;DC年間利回り（%）
        &lt;input class=&quot;form-control&quot; id=&quot;cs-dc-rate&quot; type=&quot;number&quot; min=&quot;-99&quot; max=&quot;100&quot; step=&quot;0.1&quot; value=&quot;5&quot; inputmode=&quot;decimal&quot;&gt;
      &lt;/label&gt;
      &lt;p class=&quot;limit-note text-small&quot;&gt;通常資産は上の取得額・現在の評価額・月々の積立・年間利回り・NISA設定を使います。50年後までの合計資産を確認できます。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;goal-summary&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;card viz-stat goal-primary&quot;&gt;
        &lt;div class=&quot;text-muted&quot; id=&quot;cs-combined-total-label&quot;&gt;合計資産&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-combined-total&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;cs-combined-gap&quot;&gt;—&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;div class=&quot;text-muted&quot;&gt;通常資産&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-combined-regular&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;NISA設定を反映&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;div class=&quot;text-muted&quot;&gt;DC資産&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-combined-dc&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;cs-combined-dc-note&quot;&gt;—&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;div class=&quot;text-muted&quot;&gt;積立期間&lt;/div&gt;
        &lt;div class=&quot;viz-stat-value&quot; id=&quot;cs-combined-years&quot;&gt;—&lt;/div&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;cs-combined-months&quot;&gt;—&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;compound-sim-jp&#x27;);
    const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
    const amountInputs = [&#x27;cs-cost&#x27;, &#x27;cs-current&#x27;, &#x27;cs-monthly&#x27;, &#x27;cs-target-amount&#x27;, &#x27;cs-dc-current&#x27;, &#x27;cs-dc-monthly&#x27;].map($);
    const inputs = [&#x27;cs-cost&#x27;, &#x27;cs-current&#x27;, &#x27;cs-monthly&#x27;, &#x27;cs-rate&#x27;, &#x27;cs-nisa&#x27;, &#x27;cs-current-age&#x27;, &#x27;cs-target-age&#x27;, &#x27;cs-target-amount&#x27;, &#x27;cs-dc-current&#x27;, &#x27;cs-dc-monthly&#x27;, &#x27;cs-dc-rate&#x27;].map($);
    const tabs = [&#x27;forward&#x27;, &#x27;goal&#x27;, &#x27;combined&#x27;];
    const taxRate = 0.20315;
    const nisaLifetimeLimit = 18000000;
    const nisaAnnualLimit = 3600000;
    const yen = new Intl.NumberFormat(&#x27;ja-JP&#x27;, { style: &#x27;currency&#x27;, currency: &#x27;JPY&#x27;, maximumFractionDigits: 0 });
    const shortYen = value =&gt; {
      const abs = Math.abs(value);
      if (abs &gt;= 100000000) return (value / 100000000).toFixed(abs &gt;= 1000000000 ? 0 : 1) + &#x27;億円&#x27;;
      if (abs &gt;= 10000) return (value / 10000).toFixed(abs &gt;= 1000000 ? 0 : 1) + &#x27;万円&#x27;;
      return Math.round(value).toLocaleString(&#x27;ja-JP&#x27;) + &#x27;円&#x27;;
    };
    const clean = (el, fallback = 0) =&gt; Number.isFinite(Number(el.value)) ? Number(el.value) : fallback;
    const cleanAmount = (el, fallback = 0) =&gt; {
      const value = Number(String(el.value).replace(/[^\d]/g, &#x27;&#x27;));
      return Number.isFinite(value) ? value : fallback;
    };
    const formatAmountInput = (el, keepCaret = false) =&gt; {
      const caretDigits = keepCaret
        ? String(el.value).slice(0, el.selectionStart ?? 0).replace(/[^\d]/g, &#x27;&#x27;).length
        : null;
      const raw = String(el.value).replace(/[^\d]/g, &#x27;&#x27;);
      el.value = raw ? Number(raw).toLocaleString(&#x27;ja-JP&#x27;) : &#x27;&#x27;;
      if (caretDigits == null) return;
      let digitCount = 0;
      let caret = el.value.length;
      for (let i = 0; i &lt; el.value.length; i++) {
        if (/\d/.test(el.value[i])) digitCount++;
        if (digitCount &gt;= caretDigits) {
          caret = i + 1;
          break;
        }
      }
      el.setSelectionRange(caret, caret);
    };
    const lastOf = rows =&gt; rows[rows.length - 1];

    function getBaseInputs() {
      const acquisitionCost = Math.max(0, cleanAmount($(&#x27;cs-cost&#x27;)));
      const currentValue = Math.max(0, cleanAmount($(&#x27;cs-current&#x27;)));
      const currentAge = Math.max(0, clean($(&#x27;cs-current-age&#x27;)));
      const annual = Math.max(-99, clean($(&#x27;cs-rate&#x27;))) / 100;
      const nisa = $(&#x27;cs-nisa&#x27;).checked;
      return { acquisitionCost, currentValue, currentAge, annual, nisa };
    }

    function project(months, monthly, options = getBaseInputs()) {
      const { acquisitionCost, currentValue, currentAge, annual, nisa } = options;
      const monthlyRate = Math.pow(1 + annual, 1 / 12) - 1;
      let balance = currentValue;
      let contributed = acquisitionCost;
      let annualInvested = 0;
      const rows = [];
      const makeRow = year =&gt; {
        const grossGain = balance - contributed;
        const potentialTax = Math.max(0, grossGain) * taxRate;
        const displayBalance = nisa ? balance : balance - potentialTax;
        return { year, age: currentAge + year, balance: displayBalance, contributed, gain: displayBalance - contributed, potentialTax };
      };
      rows.push(makeRow(0));
      for (let month = 1; month &lt;= months; month++) {
        if ((month - 1) % 12 === 0) annualInvested = 0;
        let deposit = monthly;
        if (nisa) {
          deposit = Math.min(deposit, Math.max(0, nisaAnnualLimit - annualInvested), Math.max(0, nisaLifetimeLimit - contributed));
        }
        balance = balance * (1 + monthlyRate) + deposit;
        contributed += deposit;
        annualInvested += deposit;
        if (month % 12 === 0 || month === months) rows.push(makeRow(month / 12));
      }
      return rows;
    }

    function calculate() {
      const base = getBaseInputs();
      const monthly = Math.max(0, cleanAmount($(&#x27;cs-monthly&#x27;)));
      const years = 50;
      const months = Math.round(years * 12);
      const rows = project(months, monthly, base);
      const nisa = base.nisa;
      return { rows, nisa, requestedMonthly: monthly, years, months };
    }

    function calculateGoal() {
      const base = getBaseInputs();
      const currentAge = base.currentAge;
      const targetAge = Math.max(0, clean($(&#x27;cs-target-age&#x27;)));
      const targetAmount = Math.max(0, cleanAmount($(&#x27;cs-target-amount&#x27;)));
      const years = Math.max(0, targetAge - currentAge);
      const months = Math.round(years * 12);
      if (months === 0) {
        const rows = project(0, 0, base);
        return { rows, months, years, neededMonthly: 0, targetAmount, reachable: lastOf(rows).balance &gt;= targetAmount };
      }
      const withoutDeposit = lastOf(project(months, 0, base));
      if (withoutDeposit.balance &gt;= targetAmount) {
        return { rows: project(months, 0, base), months, years, neededMonthly: 0, targetAmount, reachable: true };
      }
      let low = 0;
      let high = 1000;
      while (lastOf(project(months, high, base)).balance &lt; targetAmount &amp;&amp; high &lt; 1000000000) {
        high *= 2;
      }
      const cappedHigh = lastOf(project(months, high, base)).balance;
      if (cappedHigh &lt; targetAmount) {
        return { rows: project(months, high, base), months, years, neededMonthly: high, targetAmount, reachable: false };
      }
      for (let i = 0; i &lt; 48; i++) {
        const mid = (low + high) / 2;
        if (lastOf(project(months, mid, base)).balance &gt;= targetAmount) high = mid;
        else low = mid;
      }
      const neededMonthly = Math.ceil(high);
      return { rows: project(months, neededMonthly, base), months, years, neededMonthly, targetAmount, reachable: true };
    }

    function projectDc(months, currentAge = getBaseInputs().currentAge) {
      const currentValue = Math.max(0, cleanAmount($(&#x27;cs-dc-current&#x27;)));
      const monthly = Math.max(0, cleanAmount($(&#x27;cs-dc-monthly&#x27;)));
      const annual = Math.max(-99, clean($(&#x27;cs-dc-rate&#x27;))) / 100;
      const monthlyRate = Math.pow(1 + annual, 1 / 12) - 1;
      let balance = currentValue;
      let contributed = currentValue;
      const rows = [{ year: 0, age: currentAge, balance, contributed, monthly }];
      for (let month = 1; month &lt;= months; month++) {
        balance = balance * (1 + monthlyRate) + monthly;
        contributed += monthly;
        if (month % 12 === 0 || month === months) rows.push({ year: month / 12, age: currentAge + month / 12, balance, contributed, monthly });
      }
      return rows;
    }

    function calculateCombined() {
      const base = getBaseInputs();
      const years = 50;
      const months = Math.round(years * 12);
      const regularMonthly = Math.max(0, cleanAmount($(&#x27;cs-monthly&#x27;)));
      const regularRows = project(months, regularMonthly, base);
      const dcRows = projectDc(months, base.currentAge);
      const rows = regularRows.map((regular, index) =&gt; {
        const dc = dcRows[index] || lastOf(dcRows);
        return {
          year: regular.year,
          age: regular.age,
          balance: regular.balance + dc.balance,
          contributed: regular.contributed + dc.contributed,
          regularBalance: regular.balance,
          dcBalance: dc.balance,
          regularContributed: regular.contributed,
          dcContributed: dc.contributed
        };
      });
      const regular = lastOf(regularRows);
      const dc = lastOf(dcRows);
      const total = regular.balance + dc.balance;
      return { rows, regular, dc, total, targetAge: base.currentAge + years, years, months };
    }

    function render() {
      const state = calculate();
      const goal = calculateGoal();
      const combined = calculateCombined();
      const last = state.rows[state.rows.length - 1];
      $(&#x27;cs-nisa-label&#x27;).textContent = state.nisa ? &#x27;NISAを利用する&#x27; : &#x27;NISAを利用しない&#x27;;
      $(&#x27;cs-final-label&#x27;).textContent = state.years.toLocaleString(&#x27;ja-JP&#x27;) + &#x27;年後の資産&#x27;;
      $(&#x27;cs-mode-note&#x27;).textContent = state.nisa ? &#x27;NISAの非課税枠で計算&#x27; : &#x27;売却時の想定税額を差し引いて表示&#x27;;
      $(&#x27;cs-limit-note&#x27;).textContent = state.nisa
        ? &#x27;NISA：取得額と今後の積立額をもとに、年間360万円・生涯1,800万円まで計算します。上限を超える積立分は自動的に除外します。&#x27;
        : &#x27;通常の課税口座として計算します。想定税額は売却時に運用益へ20.315%を適用した概算です。&#x27;;
      $(&#x27;cs-final&#x27;).textContent = yen.format(last.balance);
      $(&#x27;cs-contrib&#x27;).textContent = yen.format(last.contributed);
      $(&#x27;cs-gain&#x27;).textContent = yen.format(last.gain);
      $(&#x27;cs-tax&#x27;).textContent = yen.format(last.potentialTax);
      $(&#x27;cs-gain&#x27;).classList.toggle(&#x27;gain-positive&#x27;, last.gain &gt;= 0);
      $(&#x27;cs-gain&#x27;).classList.toggle(&#x27;gain-negative&#x27;, last.gain &lt; 0);
      $(&#x27;cs-multiple&#x27;).textContent = last.contributed &gt; 0 ? &#x27;投資額の &#x27; + (last.balance / last.contributed).toFixed(2) + &#x27;倍&#x27; : &#x27;—&#x27;;
      $(&#x27;cs-body&#x27;).innerHTML = state.rows.slice(1).map(d =&gt; `&lt;tr&gt;&lt;td&gt;${d.year.toFixed(d.year % 1 === 0 ? 0 : 1)}年後&lt;/td&gt;&lt;td&gt;${d.age.toFixed(d.age % 1 === 0 ? 0 : 1)}歳&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.balance)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.contributed)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap ${d.gain &gt;= 0 ? &#x27;gain-positive&#x27; : &#x27;gain-negative&#x27;}&quot;&gt;${yen.format(d.gain)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.potentialTax)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
      renderGoal(goal);
      renderCombined(combined);
      draw(state.rows);
    }

    function renderGoal(goal) {
      const last = goal.rows[goal.rows.length - 1];
      $(&#x27;cs-needed-monthly&#x27;).textContent = yen.format(goal.neededMonthly);
      $(&#x27;cs-needed-note&#x27;).textContent = goal.months === 0
        ? (goal.reachable ? &#x27;現在の評価額で目標に到達しています&#x27; : &#x27;目標年齢は現在の年齢より大きくしてください&#x27;)
        : (goal.reachable ? &#x27;目標金額 &#x27; + yen.format(goal.targetAmount) + &#x27; から逆算&#x27; : &#x27;NISA上限を考慮すると目標未達の可能性があります&#x27;);
      $(&#x27;cs-goal-years&#x27;).textContent = goal.years.toFixed(goal.years % 1 === 0 ? 0 : 1) + &#x27;年&#x27;;
      $(&#x27;cs-goal-months&#x27;).textContent = goal.months.toLocaleString(&#x27;ja-JP&#x27;) + &#x27;か月で計算&#x27;;
      $(&#x27;cs-goal-final&#x27;).textContent = yen.format(last.balance);
      $(&#x27;cs-goal-contrib&#x27;).textContent = yen.format(last.contributed);
    }

    function renderCombined(combined) {
      $(&#x27;cs-combined-total&#x27;).textContent = yen.format(combined.total);
      $(&#x27;cs-combined-total-label&#x27;).textContent = combined.years.toLocaleString(&#x27;ja-JP&#x27;) + &#x27;年後の合計資産&#x27;;
      $(&#x27;cs-combined-gap&#x27;).textContent = combined.targetAge.toFixed(combined.targetAge % 1 === 0 ? 0 : 1) + &#x27;歳時点&#x27;;
      $(&#x27;cs-combined-regular&#x27;).textContent = yen.format(combined.regular.balance);
      $(&#x27;cs-combined-dc&#x27;).textContent = yen.format(combined.dc.balance);
      $(&#x27;cs-combined-dc-note&#x27;).textContent = &#x27;拠出累計 &#x27; + yen.format(combined.dc.contributed);
      $(&#x27;cs-combined-years&#x27;).textContent = combined.years.toFixed(combined.years % 1 === 0 ? 0 : 1) + &#x27;年&#x27;;
      $(&#x27;cs-combined-months&#x27;).textContent = combined.months.toLocaleString(&#x27;ja-JP&#x27;) + &#x27;か月で計算&#x27;;
      $(&#x27;cs-combined-body&#x27;).innerHTML = combined.rows.slice(1).map(d =&gt; `&lt;tr&gt;&lt;td&gt;${d.year.toFixed(d.year % 1 === 0 ? 0 : 1)}年後&lt;/td&gt;&lt;td&gt;${d.age.toFixed(d.age % 1 === 0 ? 0 : 1)}歳&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.balance)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.regularBalance)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.dcBalance)}&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${yen.format(d.contributed)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
      draw(combined.rows, &#x27;cs-combined-chart&#x27;, &#x27;cs-combined-tip&#x27;, &#x27;合計資産&#x27;, &#x27;累計投資・拠出額&#x27;);
    }

    function activateTab(name) {
      root.dataset.mode = name;
      tabs.forEach(tab =&gt; {
        const active = tab === name;
        $(&#x27;cs-tab-&#x27; + tab).setAttribute(&#x27;aria-selected&#x27;, String(active));
        $(&#x27;cs-&#x27; + tab + &#x27;-panel&#x27;).hidden = !active;
      });
      schedule();
    }

    function draw(data, chartId = &#x27;cs-chart&#x27;, tipId = &#x27;cs-tip&#x27;, totalLabel = &#x27;資産総額&#x27;, paidLabel = &#x27;累計投資額&#x27;) {
      const host = $(chartId);
      const width = Math.max(320, Math.floor(host.getBoundingClientRect().width));
      const height = width &lt; 520 ? 245 : 280;
      const margin = { top: 12, right: 16, bottom: 44, left: width &lt; 420 ? 68 : 82 };
      const iw = width - margin.left - margin.right;
      const ih = height - margin.top - margin.bottom;
      const maxValue = Math.max(1, ...data.flatMap(d =&gt; [d.balance, d.contributed]));
      const minValue = Math.min(0, ...data.map(d =&gt; d.balance));
      const pad = (maxValue - minValue) * 0.06 || 1;
      const yMax = maxValue + pad;
      const yMin = minValue &lt; 0 ? minValue - pad : 0;
      const maxYear = Math.max(1, data[data.length - 1].year);
      const x = yr =&gt; margin.left + (yr / maxYear) * iw;
      const y = val =&gt; margin.top + ih - ((val - yMin) / (yMax - yMin)) * ih;
      const points = key =&gt; data.map(d =&gt; `${x(d.year).toFixed(1)},${y(d[key]).toFixed(1)}`).join(&#x27; &#x27;);
      const area = `M ${x(0)},${y(yMin)} L ${data.map(d =&gt; `${x(d.year)},${y(d.balance)}`).join(&#x27; L &#x27;)} L ${x(maxYear)},${y(yMin)} Z`;
      const yTicks = Array.from({length: 5}, (_, i) =&gt; yMin + (yMax - yMin) * i / 4);
      const tickCount = width &lt; 420 ? 4 : 6;
      const xTicks = Array.from({length: tickCount}, (_, i) =&gt; maxYear * i / (tickCount - 1));
      host.innerHTML = `&lt;svg class=&quot;chart-svg&quot; viewBox=&quot;0 0 ${width} ${height}&quot; role=&quot;img&quot; aria-label=&quot;0年から50年までの${totalLabel}と${paidLabel}の推移&quot;&gt;
        &lt;title&gt;50年間の資産推移&lt;/title&gt;&lt;desc&gt;実線が${totalLabel}、破線が${paidLabel}です。&lt;/desc&gt;
        ${yTicks.map(v =&gt; `&lt;line class=&quot;grid-line&quot; x1=&quot;${margin.left}&quot; x2=&quot;${width-margin.right}&quot; y1=&quot;${y(v)}&quot; y2=&quot;${y(v)}&quot;&gt;&lt;/line&gt;&lt;text class=&quot;axis-muted&quot; text-anchor=&quot;end&quot; x=&quot;${margin.left-8}&quot; y=&quot;${y(v)+4}&quot;&gt;${shortYen(v)}&lt;/text&gt;`).join(&#x27;&#x27;)}
        ${xTicks.map(v =&gt; `&lt;text class=&quot;axis-muted&quot; text-anchor=&quot;middle&quot; x=&quot;${x(v)}&quot; y=&quot;${height-19}&quot;&gt;${Number.isInteger(v) ? v : v.toFixed(1)}&lt;/text&gt;`).join(&#x27;&#x27;)}
        &lt;rect data-chart-frame class=&quot;chart-frame&quot; x=&quot;${margin.left}&quot; y=&quot;${margin.top}&quot; width=&quot;${iw}&quot; height=&quot;${ih}&quot;&gt;&lt;/rect&gt;
        &lt;path class=&quot;area-total&quot; d=&quot;${area}&quot;&gt;&lt;/path&gt;
        &lt;polyline class=&quot;line-paid&quot; points=&quot;${points(&#x27;contributed&#x27;)}&quot;&gt;&lt;/polyline&gt;
        &lt;polyline class=&quot;line-total&quot; points=&quot;${points(&#x27;balance&#x27;)}&quot;&gt;&lt;/polyline&gt;
        &lt;text class=&quot;axis-title&quot; data-axis=&quot;x&quot; text-anchor=&quot;middle&quot; x=&quot;${margin.left + iw/2}&quot; y=&quot;${height-2}&quot;&gt;経過年数（年）&lt;/text&gt;
        &lt;text class=&quot;axis-title&quot; data-axis=&quot;y&quot; text-anchor=&quot;middle&quot; transform=&quot;translate(13 ${margin.top+ih/2}) rotate(-90)&quot;&gt;金額（円）&lt;/text&gt;
        &lt;line id=&quot;cs-hover-line&quot; class=&quot;hover-line&quot; y1=&quot;${margin.top}&quot; y2=&quot;${margin.top+ih}&quot; hidden&gt;&lt;/line&gt;
        &lt;circle id=&quot;cs-dot-total&quot; class=&quot;hover-dot-total&quot; r=&quot;4&quot; hidden&gt;&lt;/circle&gt;
        &lt;circle id=&quot;cs-dot-paid&quot; class=&quot;hover-dot-paid&quot; r=&quot;4&quot; hidden&gt;&lt;/circle&gt;
        &lt;rect data-chart-hit data-chart-hover-overlay=&quot;cross-series&quot; x=&quot;${margin.left}&quot; y=&quot;${margin.top}&quot; width=&quot;${iw}&quot; height=&quot;${ih}&quot; fill=&quot;transparent&quot;&gt;&lt;/rect&gt;
      &lt;/svg&gt;`;
      const svg = host.querySelector(&#x27;svg&#x27;);
      const overlay = svg.querySelector(&#x27;[data-chart-hit]&#x27;);
      const tip = $(tipId);
      const line = svg.querySelector(&#x27;#cs-hover-line&#x27;);
      const dotT = svg.querySelector(&#x27;#cs-dot-total&#x27;);
      const dotP = svg.querySelector(&#x27;#cs-dot-paid&#x27;);
      const hide = () =&gt; { [line, dotT, dotP].forEach(el =&gt; el.hidden = true); tip.hidden = true; };
      overlay.addEventListener(&#x27;pointermove&#x27;, e =&gt; {
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) * width / rect.width;
        const year = Math.max(0, Math.min(maxYear, (sx - margin.left) / iw * maxYear));
        const lo = Math.floor(year), hi = Math.ceil(year), t = year - lo;
        const interp = key =&gt; data[lo][key] + (data[hi][key] - data[lo][key]) * t;
        const total = interp(&#x27;balance&#x27;), paid = interp(&#x27;contributed&#x27;), age = interp(&#x27;age&#x27;), px = x(year);
        line.setAttribute(&#x27;x1&#x27;, px); line.setAttribute(&#x27;x2&#x27;, px); line.hidden = false;
        dotT.setAttribute(&#x27;cx&#x27;, px); dotT.setAttribute(&#x27;cy&#x27;, y(total)); dotT.hidden = false;
        dotP.setAttribute(&#x27;cx&#x27;, px); dotP.setAttribute(&#x27;cy&#x27;, y(paid)); dotP.hidden = false;
        tip.innerHTML = `&lt;strong&gt;${year.toFixed(1)}年後（${age.toFixed(1)}歳）&lt;/strong&gt;&lt;br&gt;${totalLabel}　${yen.format(total)}&lt;br&gt;${paidLabel}　${yen.format(paid)}`;
        tip.hidden = false;
        const left = Math.min(Math.max(4, e.clientX - rect.left + 12), rect.width - tip.offsetWidth - 4);
        const top = Math.max(4, e.clientY - rect.top - tip.offsetHeight - 10);
        tip.style.left = left + &#x27;px&#x27;; tip.style.top = top + &#x27;px&#x27;;
      });
      overlay.addEventListener(&#x27;pointerleave&#x27;, hide);
    }

    let frame;
    const schedule = () =&gt; { cancelAnimationFrame(frame); frame = requestAnimationFrame(render); };
    amountInputs.forEach(el =&gt; {
      formatAmountInput(el);
      el.addEventListener(&#x27;input&#x27;, () =&gt; formatAmountInput(el, true));
    });
    tabs.forEach(tab =&gt; $(&#x27;cs-tab-&#x27; + tab).addEventListener(&#x27;click&#x27;, () =&gt; activateTab(tab)));
    inputs.forEach(el =&gt; el.addEventListener(&#x27;input&#x27;, schedule));
    new ResizeObserver(schedule).observe($(&#x27;cs-chart&#x27;));
    render();
  })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
